# Mirrors the v1 gateway vhost: `resume.cuffney.com` serves the PDF inline at /.
server {
    listen 8080;
    server_name resume.cuffney.com;
    root /usr/share/nginx/html;
    index resume.pdf;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        types { application/pdf pdf; }
        default_type application/pdf;
        add_header Content-Disposition 'inline; filename="joe-cuffney-resume.pdf"';
        add_header Cache-Control "public, max-age=3600";
        try_files $uri /resume.pdf;
    }
}
