# LAN path: the UDM wildcard sends every *.cuffney.com name to the internal Traefik, which
# only routes hosts that carry an Ingress of class `internal`. Without this, LAN clients get
# a 404. The public path stays ingress.yaml (class `external`, via the tunnel).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-internal
spec:
  ingressClassName: internal
  rules:
    - host: resume.cuffney.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume
                port:
                  name: http
