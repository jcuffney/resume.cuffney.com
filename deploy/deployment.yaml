apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resume
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # nginx user in the official image
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: pdf
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # unprivileged nginx needs writable cache/pid paths
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: pdf
          configMap:
            name: resume-pdf
        - name: nginx-conf
          configMap:
            name: resume-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
